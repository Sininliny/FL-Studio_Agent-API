[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flslacker"
version = "0.1.0"
description = "FL Slacker: agent-safe capture, analysis and verified editing of FL Studio Piano Roll notes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flslacker = "flslacker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flslacker = ["ui/*", "fl_src/*.py", "contracts/*.py", "compatibility.json", "agent_guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
